version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: foodlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodlens
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-foodlens_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d foodlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
